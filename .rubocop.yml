inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rspec
  - rubocop-performance

require:
  - rubocop-rake
  - ./lib/rubocop/cop/dhanhq/use_constants.rb

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "skills/**/*"
    # Generator template output -- mirrors the target Rails app's conventions
    # (and the already-verified docs/RAILS_INTEGRATION.md patterns), not this
    # gem's own style, and references Rails/Sidekiq/ActionCable constants that
    # don't exist in this gem's own context.
    - "lib/generators/**/templates/**/*"
    # Generated by `rake contract:generate` from the vendored OpenAPI
    # documents — edit the generator (lib/DhanHQ/contract/generator.rb),
    # never this file.
    - "lib/DhanHQ/contract/metadata.rb"
    - "node_modules/**/*"
    - "website/node_modules/**/*"
    - "vendor/**/*"
    - "pkg/**/*"

# The contract namespace carries long task descriptions and setup; block
# length is not a useful signal there.
Metrics/BlockLength:
  Exclude:
    - "Rakefile"

# Contract parity/conformance suites intentionally assert many independent
# facts per API surface inside one example (one example per schema / operation
# family) — splitting them would N× the registry/spec loading cost for no
# diagnostic gain.
RSpec/MultipleExpectations:
  Exclude:
    - "spec/dhan_hq/contract/**/*"
    - "spec/dhan_hq/ws/protocol_spec.rb"
    - "spec/dhan_hq/ws/decoder_feed_spec.rb"
    - "spec/dhan_hq/sandbox_capabilities_spec.rb"

RSpec/ExampleLength:
  Exclude:
    - "spec/dhan_hq/ws/decoder_feed_spec.rb"

# Parity suites describe cross-cutting behaviour (constants vs vendored
# contract, models vs response schemas) rather than a single class under
# test; typed_order_guards exercises four model classes in one loop.
RSpec/DescribeClass:
  Exclude:
    - "spec/dhan_hq/contract/**/*"
    - "spec/dhan_hq/models/typed_order_guards_spec.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# RSpec
RSpec/MultipleExpectations:
  Max: 5

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleMemoizedHelpers:
  Max: 10

Lint/ScriptPermission:
  Exclude:
    - "bin/**/*"

Metrics/AbcSize:
  Exclude:
    - "bin/call_all_endpoints.rb"

Layout/LineLength:
  Exclude:
    - "bin/call_all_endpoints.rb"

DhanHQ/UseConstants:
  Enabled: true
  Exclude:
    - "lib/DhanHQ/constants.rb"
    - "lib/DhanHQ/ws/segments.rb"
    - "spec/**/*"