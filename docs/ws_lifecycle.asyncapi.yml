---
asyncapi: 2.6.0
info:
  title: DhanHQ Live Market Feed — lifecycle contract
  version: '2'
  description: |-
    GENERATED by `rake contract:asyncapi` from contracts/dhanhq/ws_protocol.yml.
    Do not edit by hand — regenerate instead.

    Describes the DhanHQ v2 live market feed: how a client connects and
    authenticates, the JSON command frames it publishes (subscribe /
    unsubscribe / disconnect), and the binary packet frames it receives
    in return. Byte layouts are carried in the x-dhan-struct extension
    of each message payload, copied verbatim from the ws_protocol.yml
    manifest; heartbeat, connection limits and disconnect codes live
    under x-dhan-lifecycle. Every field is LITTLE-ENDIAN; prices are
    IEEE-754 rupees (no multipliers); epochs are seconds.
servers:
  market_feed:
    url: wss://api-feed.dhan.co
    protocol: wss
    description: 'v2 live market feed. Query params are mandatory: version=2, token
      (access token), clientId, authType=2. No Authorization header.'
    bindings:
      ws:
        query:
          version: 2
          token: "{token}"
          clientId: "{clientId}"
          authType: 2
        bindingVersion: 0.1.0
  twenty_depth:
    url: wss://depth-api-feed.dhan.co/twentydepth
    protocol: wss
    description: 20-level full market depth socket (max 50 instruments, segments NSE_EQ/NSE_FNO).
  two_hundred_depth:
    url: wss://full-depth-api.dhan.co/twohundreddepth
    protocol: wss
    description: 200-level full market depth socket (max 1 instrument).
channels:
  marketfeed:
    publish:
      operationId: sendFeedCommand
      description: 'JSON command frames the client publishes: per-family subscribe/unsubscribe
        and the whole-connection disconnect.'
      message:
        oneOf:
        - "$ref": "#/components/messages/subscribeIndex"
        - "$ref": "#/components/messages/subscribeTicker"
        - "$ref": "#/components/messages/subscribeQuote"
        - "$ref": "#/components/messages/subscribeDepth"
        - "$ref": "#/components/messages/subscribeFull"
        - "$ref": "#/components/messages/subscribeMarketDepth"
        - "$ref": "#/components/messages/unsubscribeIndex"
        - "$ref": "#/components/messages/unsubscribeTicker"
        - "$ref": "#/components/messages/unsubscribeQuote"
        - "$ref": "#/components/messages/unsubscribeDepth"
        - "$ref": "#/components/messages/unsubscribeFull"
        - "$ref": "#/components/messages/unsubscribeMarketDepth"
        - "$ref": "#/components/messages/disconnectFeed"
    subscribe:
      operationId: receiveFeedPackets
      description: Binary packet frames pushed by the server. Split stacked frames
        by the 8-byte header's message_length.
      message:
        oneOf:
        - "$ref": "#/components/messages/feedIndex"
        - "$ref": "#/components/messages/feedTicker"
        - "$ref": "#/components/messages/feedDepth"
        - "$ref": "#/components/messages/feedQuote"
        - "$ref": "#/components/messages/feedOi"
        - "$ref": "#/components/messages/feedPrevClose"
        - "$ref": "#/components/messages/feedMarketStatus"
        - "$ref": "#/components/messages/feedFull"
        - "$ref": "#/components/messages/feedDisconnect"
    description: Live market feed (ticker / quote / index / depth / full / OI / prev-close
      / market status / disconnect).
  twenty-depth:
    publish: &1
      operationId: sendDepthCommand
      description: Subscribe/unsubscribe instruments on a full-market-depth socket
        (request codes from request_codes.market_depth).
      message:
        oneOf:
        - "$ref": "#/components/messages/subscribeMarketDepth"
        - "$ref": "#/components/messages/unsubscribeMarketDepth"
    subscribe: &2
      operationId: receiveFullMarketDepth
      description: 'Stacked FMD frames: a 12-byte header followed by rows of 16 bytes;
        frame sizes in x-dhan-struct.'
      message:
        "$ref": "#/components/messages/feedFullMarketDepth"
    description: 20-level full market depth.
  two-hundred-depth:
    publish: *1
    subscribe: *2
    description: 200-level full market depth.
components:
  messages:
    subscribeIndex:
      description: 'Subscribe index on the live feed. RequestCode 14 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 14
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: &3
              - exchangeSegment
              - securityId
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    subscribeTicker:
      description: 'Subscribe ticker on the live feed. RequestCode 15 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 15
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    subscribeQuote:
      description: 'Subscribe quote on the live feed. RequestCode 17 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 17
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    subscribeDepth:
      description: 'Subscribe depth on the live feed. RequestCode 19 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 19
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    subscribeFull:
      description: 'Subscribe full on the live feed. RequestCode 21 (unsubscribe =
        subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 21
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    subscribeMarketDepth:
      description: 'Subscribe market_depth on the live feed. RequestCode 23 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 23
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    unsubscribeIndex:
      description: 'Unsubscribe index on the live feed. RequestCode 13 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 13
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    unsubscribeTicker:
      description: 'Unsubscribe ticker on the live feed. RequestCode 16 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 16
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    unsubscribeQuote:
      description: 'Unsubscribe quote on the live feed. RequestCode 18 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 18
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    unsubscribeDepth:
      description: 'Unsubscribe depth on the live feed. RequestCode 20 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 20
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    unsubscribeFull:
      description: 'Unsubscribe full on the live feed. RequestCode 22 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 22
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    unsubscribeMarketDepth:
      description: 'Unsubscribe market_depth on the live feed. RequestCode 24 (unsubscribe
        = subscribe + 1, except the index family: subscribe 14 / unsubscribe 13).'
      payload:
        type: object
        required:
        - requestCode
        - instruments
        properties:
          requestCode:
            type: integer
            const: 24
          instruments:
            type: array
            maxItems: 100
            items:
              type: object
              required: *3
              properties:
                exchangeSegment:
                  type: string
                securityId:
                  type: string
    disconnectFeed:
      description: Whole-connection teardown frame (RequestCode 12). This is NOT an
        unsubscribe.
      payload:
        type: object
        required:
        - requestCode
        properties:
          requestCode:
            type: integer
            const: 12
    feedIndex:
      description: Server frame, first byte = 1, 32 bytes. Byte layout in x-dhan-struct
        (offsets 0-based; header occupies 0–7).
      payload:
        type: object
        x-dhan-struct:
          code: 1
          size: 32
          fields:
          - name: latest
            type: float32
            offset: 8
          - name: open
            type: float32
            offset: 12
          - name: close
            type: float32
            offset: 16
          - name: high
            type: float32
            offset: 20
          - name: low
            type: float32
            offset: 24
          - name: update_time
            type: uint32
            offset: 28
    feedTicker:
      description: Server frame, first byte = 2, 16 bytes. Byte layout in x-dhan-struct
        (offsets 0-based; header occupies 0–7).
      payload:
        type: object
        x-dhan-struct:
          code: 2
          size: 16
          fields:
          - name: ltp
            type: float32
            offset: 8
          - name: ltt
            type: uint32
            offset: 12
    feedDepth:
      description: Server frame, first byte = 3, 112 bytes. Byte layout in x-dhan-struct
        (offsets 0-based; header occupies 0–7).
      payload:
        type: object
        x-dhan-struct:
          code: 3
          size: 112
          fields:
          - name: ltp
            type: float32
            offset: 8
          arrays:
          - name: market_depth
            offset: 12
            count: 5
            each: 20
            fields:
            - name: bid_quantity
              type: uint32
              offset: 0
            - name: ask_quantity
              type: uint32
              offset: 4
            - name: no_of_bid_orders
              type: uint16
              offset: 8
            - name: no_of_ask_orders
              type: uint16
              offset: 10
            - name: bid_price
              type: float32
              offset: 12
            - name: ask_price
              type: float32
              offset: 16
    feedQuote:
      description: Server frame, first byte = 4, 50 bytes. Byte layout in x-dhan-struct
        (offsets 0-based; header occupies 0–7).
      payload:
        type: object
        x-dhan-struct:
          code: 4
          size: 50
          fields:
          - name: ltp
            type: float32
            offset: 8
          - name: last_trade_qty
            type: uint16
            offset: 12
          - name: ltt
            type: uint32
            offset: 14
          - name: atp
            type: float32
            offset: 18
          - name: volume
            type: uint32
            offset: 22
          - name: total_sell_qty
            type: uint32
            offset: 26
          - name: total_buy_qty
            type: uint32
            offset: 30
          - name: day_open
            type: float32
            offset: 34
          - name: day_close
            type: float32
            offset: 38
          - name: day_high
            type: float32
            offset: 42
          - name: day_low
            type: float32
            offset: 46
    feedOi:
      description: Server frame, first byte = 5, 12 bytes. Byte layout in x-dhan-struct
        (offsets 0-based; header occupies 0–7).
      payload:
        type: object
        x-dhan-struct:
          code: 5
          size: 12
          fields:
          - name: open_interest
            type: uint32
            offset: 8
    feedPrevClose:
      description: Server frame, first byte = 6, 16 bytes. Byte layout in x-dhan-struct
        (offsets 0-based; header occupies 0–7).
      payload:
        type: object
        x-dhan-struct:
          code: 6
          size: 16
          fields:
          - name: prev_close
            type: float32
            offset: 8
          - name: oi_prev
            type: uint32
            offset: 12
    feedMarketStatus:
      description: Server frame, first byte = 7, 8 bytes. Byte layout in x-dhan-struct
        (offsets 0-based; header occupies 0–7).
      payload:
        type: object
        x-dhan-struct:
          code: 7
          size: 8
          fields: []
    feedFull:
      description: Server frame, first byte = 8, 162 bytes. Byte layout in x-dhan-struct
        (offsets 0-based; header occupies 0–7).
      payload:
        type: object
        x-dhan-struct:
          code: 8
          size: 162
          fields:
          - name: ltp
            type: float32
            offset: 8
          - name: last_trade_qty
            type: uint16
            offset: 12
          - name: ltt
            type: uint32
            offset: 14
          - name: atp
            type: float32
            offset: 18
          - name: volume
            type: uint32
            offset: 22
          - name: total_sell_qty
            type: uint32
            offset: 26
          - name: total_buy_qty
            type: uint32
            offset: 30
          - name: open_interest
            type: uint32
            offset: 34
          - name: highest_oi
            type: uint32
            offset: 38
          - name: lowest_oi
            type: uint32
            offset: 42
          - name: day_open
            type: float32
            offset: 46
          - name: day_close
            type: float32
            offset: 50
          - name: day_high
            type: float32
            offset: 54
          - name: day_low
            type: float32
            offset: 58
          arrays:
          - name: market_depth
            offset: 62
            count: 5
            each: 20
            fields:
            - name: bid_quantity
              type: uint32
              offset: 0
            - name: ask_quantity
              type: uint32
              offset: 4
            - name: no_of_bid_orders
              type: uint16
              offset: 8
            - name: no_of_ask_orders
              type: uint16
              offset: 10
            - name: bid_price
              type: float32
              offset: 12
            - name: ask_price
              type: float32
              offset: 16
    feedDisconnect:
      description: Server frame, first byte = 50, 10 bytes. Byte layout in x-dhan-struct
        (offsets 0-based; header occupies 0–7).
      payload:
        type: object
        x-dhan-struct:
          code: 50
          size: 10
          fields:
          - name: disconnection_code
            type: uint16
            offset: 8
      examples:
      - payload:
          disconnection_code: 805
        summary: Connection limit exceeded
      - payload:
          disconnection_code: 806
        summary: Data APIs not subscribed
      - payload:
          disconnection_code: 807
        summary: Access token is expired
      - payload:
          disconnection_code: 808
        summary: Authentication Failed - Check Client ID
      - payload:
          disconnection_code: 809
        summary: Access token is invalid
    feedFullMarketDepth:
      description: Stacked full-market-depth frames (header + rows); sizes and limits
        in x-dhan-struct.
      payload:
        type: object
        x-dhan-struct:
          header:
            size: 12
            fields:
            - name: message_length
              type: int16
              offset: 0
            - name: feed_response_code
              type: uint8
              offset: 2
            - name: exchange_segment
              type: uint8
              offset: 3
            - name: security_id
              type: int32
              offset: 4
            - name: rows
              type: uint32
              offset: 8
          row:
            size: 16
            fields:
            - name: price
              type: float64
              offset: 0
            - name: quantity
              type: uint32
              offset: 8
            - name: orders
              type: uint32
              offset: 12
          frame_sizes:
            twenty_level: 332
            twohundred_level: 3212
          limits:
            twenty_level_instruments: 50
            twohundred_level_instruments: 1
            segments:
            - NSE_EQ
            - NSE_FNO
x-dhan-lifecycle:
  v2_url: wss://api-feed.dhan.co
  v2_query_params:
    version: 2
    token: required
    clientId: required
    authType: 2
  market_depth_urls:
    twenty_level: wss://depth-api-feed.dhan.co/twentydepth
    twohundred_level: wss://full-depth-api.dhan.co/twohundreddepth
  max_connections_per_user: 5
  max_instruments_per_connection: 5000
  max_instruments_per_json_message: 100
  server_ping_interval_seconds: 10
  dead_after_silence_seconds: 40
  no_session_ttl: true
  disconnect_codes:
    805: Connection limit exceeded
    806: Data APIs not subscribed
    807: Access token is expired
    808: Authentication Failed - Check Client ID
    809: Access token is invalid
